<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf3e9">
  <title>Meera — Offline</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; background: #faf3e9; color: #0c3c26; }
    body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 0 24px; }
    main { max-width: 360px; text-align: center; }
    h1 { font-size: 24px; font-weight: 600; }
    p { line-height: 1.6; }
    button { min-height: 48px; padding: 12px 24px; border: 0; border-radius: 24px; background: #0c3c26; color: #faf3e9; font: inherit; cursor: pointer; }
    @media (prefers-color-scheme: dark) { :root { background: #262624; color: #faf3e9; } button { background: #faf3e9; color: #0c3c26; } }
  </style>
</head>
<body>
  <main>
    <h1>You’re offline</h1>
    <p>Connect to the internet to reopen Meera. Your saved draft will be waiting on this device.</p>
    <button id="retry" type="button">Try again</button>
  </main>
  <script>
    let checking = false;
    let retryTimer;
    async function recover() {
      if (checking || !navigator.onLine || document.visibilityState === 'hidden') return;
      checking = true;
      try {
        // An online event can precede a usable connection. Confirm the server is reachable.
        const response = await fetch('/offline.html', { cache: 'no-store' });
        if (response.ok) { location.reload(); return; }
      } catch (_) { /* Keep the recovery screen until the connection is usable. */ }
      checking = false;
      clearTimeout(retryTimer);
      retryTimer = setTimeout(recover, 1500);
    }
    document.getElementById('retry').addEventListener('click', recover);
    window.addEventListener('online', () => { clearTimeout(retryTimer); retryTimer = setTimeout(recover, 300); });
    window.addEventListener('offline', () => clearTimeout(retryTimer));
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') recover(); });
  </script>
</body>
</html>
